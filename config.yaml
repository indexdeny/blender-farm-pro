# ════════════════════════════════════════════════════════════════════════════
#  Blender Farm Pro — central configuration
#  Forked from PharmaGen PRO (feature/blender-renderer-experiment). Paths below
#  are remapped onto this fork's numbered folder structure (00_.../01_.../...);
#  everything else (Stage logic, routing, verification, RPA/Blender engines) is
#  unchanged from the source project. See 00_PROJECT_STATE/CURRENT_STATE.md for
#  the fork rationale and 00_governance/DECISIONS/ for the original ADRs.
#  All paths are relative to the project root (the folder containing main.py)
#  unless given as an absolute path. Anything omitted falls back to the built-in
#  defaults in src/utils.py — NOTE: those built-in defaults still point at the
#  ORIGINAL PharmaGen PRO paths (SSOT/, pipeline/, render_output/, output/), not
#  this fork's numbered folders. This config.yaml is therefore REQUIRED here
#  (not optional as in the source project) — do not delete it.
# ════════════════════════════════════════════════════════════════════════════

paths:
  # ── Single Source of Truth (SSOT) — remapped to 03_knowledge_graph/ ─────────
  ssot_sku_csv:        "03_knowledge_graph/SKU.csv"
  ssot_master_json:    "03_knowledge_graph/master.json"
  ssot_design_specs:   "03_knowledge_graph/master_pharma_design_specs.json"

  # ── Stage I/O — remapped to 04_passports/ and 01_input_raster/ ──────────────
  passports_json:      "04_passports/passports_json"           # input  (Stage 1)  JSON v2.1
  passports_md:        "04_passports/passports_markdown"       # output (Stage 1)  MD prompts
  passports_manifests: "04_passports/render_manifests"         # output (Stage 1)  render manifests — the Stage 1 -> Stage 2 contract (schemas/render_manifest.schema.json)
  renders_raw:         "01_input_raster/gemini_renders_raw"    # output (Stage 2, gemini)  raw PNG
  renders_failed:      "02_processing/render_failed"           # Stage 2 failure screenshots
  renders_failed_logs: "02_processing/failed_logs"             # Stage 2 failure log
  renders_final:       "01_input_raster/gemini_renders_final"  # output (Stage 3)  final WEBP

  # ── Bookkeeping — remapped to 00_PROJECT_STATE/ ──────────────────────────────
  logs:                "00_PROJECT_STATE/logs"
  failures_log:        "00_PROJECT_STATE/verification_failures.log"
  progress_file:       "00_PROJECT_STATE/gemini_rpa_progress_v23.txt"

# ── Stage 2: Selenium / Gemini RPA renderer (unchanged from source project) ──
rpa:
  # Pre-authenticated Chrome profile (Gemini session must already be logged in).
  browser_profile_dir:  'C:\CHANGE_ME\Chrome\Profile 1'
  browser_profile_name: "Profile 1"
  downloads_dir:        'C:\CHANGE_ME\Downloads'
  gemini_url:           "https://gemini.google.com/app"
  # WARNING: Gemini blocks image generation in headless mode. Leave false.
  headless:                 false
  batch_size:               1     # passports per chat session before context reset
  image_generation_timeout: 180   # seconds
  download_timeout:         60     # seconds
  ready_timeout:            30     # seconds
  post_click_delay:         2      # seconds

# ── Stage 2 engine selection — Blender Farm Pro defaults to blender ──────────
render:
  engine: "blender"    # gemini | blender  — this fork's whole purpose is Blender, so it defaults here (the source project defaults to gemini)

# ── Stage 2: Blender renderer — the primary engine of this fork ─────────────
blender:
  executable:   'C:\Program Files\Blender Foundation\Blender 5.1\blender.exe'
  scenes_dir:   "05_assets/blender/scenes"          # optional hand-authored .blend templates (Phase 2)
  driver_script: "05_assets/blender/render_driver.py"
  output_dir:   "02_processing/blender_test_renders"  # Blender's own render attempts (distinct from the 01_input_raster/ reference material)
  final_dir:    "02_processing/blender_renders_final"  # Stage 3 output for this engine, kept away from 01_input_raster/gemini_renders_final
  engine_type:  "CYCLES"                         # Blender engine identifier, e.g. CYCLES | BLENDER_EEVEE | BLENDER_WORKBENCH.
                                                 # Must be an identifier this Blender build accepts ("EEVEE" is not one);
                                                 # an unavailable engine now fails the render rather than silently substituting.
  resolution:   [2048, 2048]
  samples:      16                               # Calibrated, not guessed: measured against a 256-sample reference on 1-min,
                                                 # 16 lands at 60.6 dB PSNR (>40 dB is already indistinguishable) and Stage 3's
                                                 # own resize+WEBP shifts pixels more than the sample count does. 64 cost 167 s
                                                 # per SKU for no measurable gain; 16 costs 67 s. Roughly 45 s of that is fixed
                                                 # (startup, BVH, denoiser), so lowering further buys little. Re-check after any
                                                 # material/geometry change that adds glass, metal or real GI.
  render_timeout: 300   # seconds, per SKU — ~4.5x headroom at 16 samples (was ~1.8x at 64)
  # ── Compute device ────────────────────────────────────────────────────────
  # Cycles' sampling device, and separately the denoiser's. STATED rather than
  # inherited, which is the whole point of these two keys: setup_render() never
  # assigned `scene.cycles.device` at all, so the device was whatever the
  # process happened to start with — and a second `--python` argument before the
  # driver could move the whole render onto the GPU with nothing in the log
  # saying so. scripts/probe_render_device.py does exactly that, deliberately,
  # and it is the reason these keys exist.
  #
  # CPU is not a placeholder. Measured 2026-08-24 on an RTX 2060 SUPER against
  # the CPU render of 1-min / 64-min / 357-min, all at 16 samples:
  #
  #   OPTIX sampling        1.17-1.34x faster,  up to 43 levels apart on 0.2-0.9% of pixels
  #   CUDA  sampling        1.18-1.45x faster,  up to 23 levels apart on 0.2-0.7% of pixels
  #   OPTIX + GPU denoise   1.6-5.4x  faster,   up to 43 levels apart on 14-18% of pixels
  #
  # None reproduces the CPU image, so none can be switched on without re-taking
  # every figure measured against it — every design_qa row, the calibration
  # curve, and the OCR fixtures. That is a phase of its own, not a config tweak.
  #
  # HOW THESE REACH THE RENDER, and the one thing to know before changing them.
  # The driver may not import project code — it runs inside Blender's own
  # interpreter — so it cannot read this file. It carries the same three values
  # as flag defaults (--device / --device-backend / --denoising-device), and
  # `tests/test_render_driver.py` asserts the defaults equal what is written
  # here. Nothing passes them on the command line yet: that would mean editing
  # src/blender_renderer.py, which is outside this migration's allowed changes.
  #
  # So changing a value here does NOT change a render on its own — it fails the
  # test instead, until someone changes the driver's default to match and wires
  # the flag through the launchers. That is deliberate. A config key that
  # silently did nothing is the failure this project already has one example of
  # (`smoothness`, measured and read by nobody); a key that stops the suite
  # until the wiring exists is a statement with teeth.
  #
  # device:           CPU | GPU  — GPU needs `device_backend` below
  # device_backend:   OPTIX | CUDA | HIP | ONEAPI — ignored when device is CPU
  # denoising_device: CPU | GPU  — independent of `device`; the denoiser is more
  #                   than half of every render, so this is where the time is
  device:           "CPU"
  device_backend:   "OPTIX"
  denoising_device: "CPU"

# ── Stage 3: final image processor (webp_converter behaviour — canonical) ────
image_processor:
  # "auto" = wherever the SELECTED Stage 2 engine writes (src/render_stage.py
  # resolves it: blender.output_dir for blender, paths.renders_raw for gemini).
  # A real path here overrides that and wins -- the key is a live override, not
  # dead weight. It was a constant pointing at the Gemini directory until
  # 2026-08-10, which meant `--full` under the blender engine converted nothing
  # it had just rendered and still reported success.
  source_dir:       "auto"
  # "auto" mirrors source_dir on the output side: each engine keeps its own
  # final directory. Both engines name their WEBP after the SKU stem, so a
  # shared output dir means Blender silently overwrites Gemini's finished
  # artefacts -- the same collision the raw directories were split to avoid.
  output_dir:       "auto"
  # scripts/image_postprocessor.py's own failure copies (named after the SKU
  # stem, e.g. 1-min.png). Deliberately its own directory, NOT paths.renders_failed
  # (02_processing/render_failed) -- that one is Stage 2's RPA/Selenium error
  # screenshots (src/rpa_orchestrator.py), a different producer with a different
  # naming scheme; sharing a bin invites a silent collision between the two.
  failed_dir:       "02_processing/image_postprocessor_failed"
  # scripts/image_postprocessor.py's own output (2048px WEBP, quality 85 --
  # see scripts/README.md, "non-canonical"). Deliberately its own directory,
  # NOT output_dir above: output_dir is src/image_processor.py's CANONICAL
  # Stage 3 output, and git tracks 389 deliverables there. Both scripts derive
  # the same {stem}.webp filename, so sharing output_dir would let this script
  # silently overwrite every canonical deliverable with a file that violates
  # the documented Stage 3 contract (1600px, <=500KB) -- same failure shape
  # failed_dir above was split out to avoid, one directory over.
  postprocessor_output_dir: "02_processing/image_postprocessor_output"
  target_size:      [1600, 1600]   # px (LANCZOS upscale, square 1:1)
  max_file_size_kb: 500            # hard weight cap; quality is auto-tuned

# ── Orchestration ─────────────────────────────────────────────────────────────
pipeline:
  render_retries: 1   # stage-level retries for the render stage on hard failure

logging:
  level: "INFO"       # INFO | DEBUG | WARNING | ERROR  (--debug forces DEBUG)
